version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kronos-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - ./backend/database.db:/app/database.db
    restart: always

  frontend:
    image: nginx:alpine
    container_name: kronos-frontend
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: always
