name: Kronos AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install Root & Subproject Dependencies
      run: npm run install:all

    - name: Build Production Distribution
      run: npm run build

    - name: Verify Dist Synchronization
      run: node scripts/sync-dist.js
