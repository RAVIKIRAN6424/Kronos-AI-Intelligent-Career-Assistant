name: Node.js CI & Production Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify (Node.js)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install All Dependencies (Root, Backend, Frontend)
        run: |
          npm install
          npm --prefix backend install
          npm --prefix frontend install

      - name: Build Vite Frontend & Synchronize Assets
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          node -e "if (!require('fs').existsSync('dist/index.html')) { console.error('Missing dist/index.html'); process.exit(1); } else { console.log('✅ Build verification passed!'); }"
